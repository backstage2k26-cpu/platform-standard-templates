name: Liquibase PostgreSQL Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - id: ver
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - run: mvn clean package -B

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: .

      - uses: actions/upload-artifact@v4
        with:
          name: target
          path: target

  prepare-context:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - uses: actions/download-artifact@v4
        with:
          name: target
          path: target

      - run: |
          mkdir docker-context
          tar -xzf target/liquibase-postgresql-${{ needs.version.outputs.version }}-liquibase.tar.gz -C docker-context
          cp -r docker-context/liquibase-postgresql-${{ needs.version.outputs.version }}/changelog .
          cp docker-context/liquibase-postgresql-${{ needs.version.outputs.version }}/liquibase.properties .
          cp docker-context/liquibase-postgresql-${{ needs.version.outputs.version }}/docker/entrypoint.sh .

      - uses: actions/upload-artifact@v4
        with:
          name: docker-context
          path: .

  docker:
    needs: [version, prepare-context]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-context

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: liquibase-review:${{ needs.version.outputs.version }}

      - run: docker save liquibase-review:${{ needs.version.outputs.version }} -o liquibase-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: liquibase-image.tar

  postgres:
    needs: docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backstage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - run: docker load -i liquibase-image.tar

      - run: until pg_isready -h localhost -U postgres; do sleep 2; done

      - env:
          PGPASSWORD: postgres
        run: pg_dump -h localhost -U postgres backstage > database.sql

      - uses: actions/upload-artifact@v4
        with:
          name: db-dump
          path: database.sql

  liquibase-validate:
    needs: [version, postgres]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backstage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - uses: actions/download-artifact@v4
        with:
          name: db-dump

      - run: docker load -i liquibase-image.tar

      - env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres backstage < database.sql

      - run: |
          docker run --rm --network host \
            liquibase-review:${{ needs.version.outputs.version }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres validate

      - env:
          PGPASSWORD: postgres
        run: pg_dump -h localhost -U postgres backstage > database.sql

      - uses: actions/upload-artifact@v4
        with:
          name: db-after-validate
          path: database.sql

  liquibase-update:
    needs: [version, liquibase-validate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backstage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - uses: actions/download-artifact@v4
        with:
          name: db-after-validate

      - run: docker load -i liquibase-image.tar

      - env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres backstage < database.sql

      - run: |
          docker run --rm --network host \
            liquibase-review:${{ needs.version.outputs.version }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres update

      - env:
          PGPASSWORD: postgres
        run: pg_dump -h localhost -U postgres backstage > database.sql

      - uses: actions/upload-artifact@v4
        with:
          name: db-after-update
          path: database.sql

  tag-baseline:
    needs: [version, liquibase-update]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backstage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - uses: actions/download-artifact@v4
        with:
          name: db-after-update

      - run: docker load -i liquibase-image.tar

      - env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres backstage < database.sql

      - run: |
          docker run --rm --network host \
            liquibase-review:${{ needs.version.outputs.version }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres tag review-baseline

  compare-main:
    needs: tag-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git fetch origin main
          git diff origin/main...HEAD -- changelog || true

  review:
    needs: compare-main
    runs-on: ubuntu-latest
    steps:
      - run: echo "Liquibase PR review pipeline completed."
