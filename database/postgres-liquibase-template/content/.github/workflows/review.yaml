name: Liquibase PostgreSQL Review

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:


env:
  APPLICATION: liquibase-postgresql
  ARTIFACT_VERSION: 1.0.0-SNAPSHOT


jobs:

  review:

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: backstage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d backstage"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      ##################################
      # Checkout
      ##################################

      - name: Checkout source
        uses: actions/checkout@v4


      ##################################
      # Java + Maven
      ##################################

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven


      - name: Build artifact
        run: |
          mvn clean package -B

          echo "ARTIFACT_VERSION=$(mvn help:evaluate \
          -Dexpression=project.version \
          -q \
          -DforceStdout)" >> $GITHUB_ENV

      - name: Inspect artifact
        run: |
          ls -R target

      ##################################
      # Prepare Docker context
      ##################################

      - name: Extract Liquibase artifact
        run: |
          echo "Extracting Liquibase artifact"

          tar -xzvf target/liquibase-postgresql-${ARTIFACT_VERSION}-liquibase.tar.gz

          echo "Checking extracted files"

          find liquibase-postgresql-${ARTIFACT_VERSION} -type f

      - name: Prepare Docker context
        run: |
          echo "Extracting Liquibase artifact"

          rm -rf docker-context
          mkdir docker-context

          tar -xzf target/liquibase-postgresql-${ARTIFACT_VERSION}-liquibase.tar.gz -C docker-context

          cp -r docker-context/liquibase-postgresql-${ARTIFACT_VERSION}/changelog .
          cp docker-context/liquibase-postgresql-${ARTIFACT_VERSION}/liquibase.properties .
          cp docker-context/liquibase-postgresql-${ARTIFACT_VERSION}/docker/entrypoint.sh .

          echo "Checking extracted files"
          ls -R changelog

      - name: Verify Docker context
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          find . -maxdepth 3 -type f | sort

          echo "Changelog directory:"
          ls -lah changelog
      ##################################
      # Docker build
      ##################################

      - name: Build Liquibase image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: |
            liquibase-postgres-review:${{ github.run_number }}

      - name: Debug docker image
        run: |
          docker run --rm --entrypoint sh liquibase-postgres-review:${{ github.run_number }} -c "ls -R /liquibase"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d backstage \
            -c "SELECT version();"

      - name: Apply master (base) changelog
        run: |
          echo "Applying master changelog"

          docker run --rm --network host \
            liquibase-postgres-review:${{ github.run_number }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url="jdbc:postgresql://localhost:5432/backstage" \
            --username="postgres" \
            --password="postgres" \
            update

      - name: Checkout main branch separately
        run: |
          git fetch origin main
          git worktree add /tmp/main origin/main

          ls -la /tmp/main


      - name: Validate main changelog
        run: |
          docker run --rm --network host \
            liquibase-postgres-review:${{ github.run_number }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres \
            validate

      - name: Apply base schema
        run: |
          docker run --rm --network host \
            liquibase-postgres-review:${{ github.run_number }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres \
            update

      - name: Tag baseline
        run: |
          docker run --rm --network host \
            liquibase-postgres-review:${{ github.run_number }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres \
            tag review-baseline